<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>GoalKart</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#EEF3EC;--card:#fff;--tx:#0F2A21;--mu:#5f7569;--ac:#2F7D5B;--bd:#dbe4dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1914;--card:#12271F;--tx:#F2F5EE;--mu:#9db5a8;--bd:#1f3a2f;--ac:#8DBF9F}}
:root[data-theme="dark"]{--bg:#0A1914;--card:#12271F;--tx:#F2F5EE;--mu:#9db5a8;--bd:#1f3a2f;--ac:#8DBF9F}
:root[data-theme="black"]{--bg:#000;--card:#08120e;--tx:#F2F5EE;--mu:#9db5a8;--bd:#1a2e25;--ac:#8DBF9F}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(at 0 0,#8DBF9F55,transparent 50%),radial-gradient(at 100% 10%,#B9A5E855,transparent 45%),radial-gradient(at 0 100%,#F5C9A455,transparent 50%),var(--bg) fixed;color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #0000001a}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:14px}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
textarea{width:100%;min-height:90px}input,select{max-width:100%}
button{cursor:pointer}button.p{background:linear-gradient(135deg,#2F7D5B,#1d5a42);color:#fff;border:0}
button.g{background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:8px 14px;font-size:14px;font-weight:600;border-radius:999px}
button.g.d{color:#e5484d;border-color:#e5484d55}
button:hover{border-color:var(--ac)}button:active{transform:scale(.96)}
button.p{box-shadow:0 6px 18px #2f7d5b44;font-weight:600}
.chip{border-radius:999px}
label.chip{border:1px solid var(--bd);border-radius:999px;padding:8px 14px;cursor:pointer;background:var(--bg);font-weight:600;font-size:14px}
label.chip input{display:none}
label.chip:has(input:checked){background:var(--ac);color:#fff;border-color:var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #20D9E8;outline-offset:2px}
.chk{width:44px;height:44px;border-radius:50%;flex:none;font-size:18px;padding:0}
.chk.on{background:var(--ac);border-color:var(--ac);color:#fff}.chk.part{border-color:var(--ac);color:var(--ac)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8DBF9F,var(--ac))}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#0F2A21;border-radius:999px;display:flex;justify-content:center;padding:6px;box-shadow:0 10px 30px #0006;max-width:696px;margin:0 auto}
nav{gap:2px}
nav button{flex:1;max-width:110px;border:0;background:none;border-radius:999px;padding:10px 2px;font-size:13px;color:#9db5a8}
nav button.on{color:#fff;background:linear-gradient(135deg,#2F7D5B,#1d5a42);font-weight:700}
.chip{display:inline-block;margin:4px 6px 4px 0}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.big{font-size:54px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
.w{display:flex;flex-wrap:wrap;gap:6px}
.hero{background:linear-gradient(135deg,#0F2A21,#1d4a38);color:#F2F5EE;border:0}.hero .g{background:#ffffff22;color:#fff;border-color:#ffffff33}.hero .bar{background:#ffffff33}.hero .bar i{background:#CFE8D5}
.pc{color:#0F2A21}.pc .mu{color:#3d5a4c}.pc button{background:#ffffffcc;color:#0F2A21;border-color:#ffffff}.pc .chk.on{background:#0F2A21;color:#fff}
.strip{display:flex;gap:6px;margin:8px 0}.strip div{flex:1;text-align:center;border:1px solid var(--bd);border-radius:999px;padding:8px 0;font-size:12px;color:var(--mu);background:var(--card)}.strip b{display:block;font-size:15px;color:var(--tx)}.strip .on{background:#0F2A21;border-color:#0F2A21}.strip .on,.strip .on b{color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border-radius:24px;padding:16px;border:0;color:#0F2A21;min-height:122px;box-shadow:0 4px 14px #0000001a}.tile .mu{color:#3d5a4c}.tile .em{font-size:28px}.tile .bar{width:100%;margin-top:auto;background:#ffffff99}.tile.add{background:var(--card)!important;color:var(--tx);border:2px dashed var(--bd);box-shadow:none}
.chart{display:flex;gap:6px;align-items:flex-end;height:120px;margin:10px 0}.chart div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--mu);gap:4px}.chart i{display:block;width:100%;background:linear-gradient(#8DBF9F,#2F7D5B);border-radius:8px 8px 4px 4px;min-height:3px}
.strip button{flex:1;padding:8px 0;border-radius:999px;font-size:12px;background:var(--card);color:var(--mu)}nav button small{font-size:11px}nav button{line-height:1.2}
</style></head><body><main id="app"></main><nav id="nav"></nav>
<script>
const KEY='goalkart.v1';
const AREAS=['Student','Fitness','Reading','Career','Creator','Trading Education','General Discipline','Custom'];
const ACC=['#4567FF','#20D9E8','#9061FF','#e8704a'];
let S=load();norm();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s)return s}catch(e){}
return{theme:'system',accent:ACC[0],personas:null,goals:[],habits:[],logs:{},diary:{},focus:[],rest:[],tab:'today'}}
function norm(){['tr','ch'].forEach(k=>S[k]=S[k]||{});['cust','off','tasks','notes'].forEach(k=>S[k]=S[k]||[])}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromS=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=fromS(s);d.setDate(d.getDate()+n);return ds(d)};
const today=()=>ds(new Date());
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val=(h,d)=>(S.logs[h.id]||{})[d]||0;
const done=(h,d)=>val(h,d)>=h.target;
const sched=(h,d)=>!h.paused&&d>=h.start&&h.days.includes(fromS(d).getDay())&&!S.rest.includes(d);
function streak(h){let d=today(),n=0,first=true;
for(let i=0;i<800;i++,d=addD(d,-1)){if(d<h.start)break;
if(!h.days.includes(fromS(d).getDay())||S.rest.includes(d))continue;
if(done(h,d))n++;else if(first&&d===today()){}else break;first=false}return n}
function applyTheme(){const r=document.documentElement;
if(S.theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);
}

const PAS=['#CFE8D5','#FCE3CF','#E2D8F5','#F6EDC0'];
function render(){applyTheme();save();
if(!S.personas){return onboard()}
const T=[['today','🏠','Home'],['hub','🧩','Hub'],['tasks','✅','Tasks'],['goals','🎯','Goals'],['more','☰','More']],act=['today','hub','tasks','goals'].includes(S.tab)?S.tab:'more';
$('#nav').innerHTML=T.map(t=>`<button class="${act===t[0]?'on':''}" data-t="${t[0]}">${t[1]}<br><small>${t[2]}</small></button>`).join('');
$('#nav').onclick=e=>{const b=e.target.closest('button'),t=b&&b.dataset.t;if(t){S.tab=t;S.open='';render()}};
({today:vToday,hub:vHub,tasks:vTasks,goals:vGoals,more:vMore,notes:vNotes,ach:vAch,focus:vFocus,journal:vJournal,report:vReport,set:vSet})[S.tab]()}
function onboard(){$('#nav').innerHTML='';let sel=[];
$('#app').innerHTML=`<div class="row">${LOGO}<h1 style="margin:0">GoalKart</h1></div><p class="mu">Plan your goals. Build your future.</p>
<div class="card"><b>What are you working on?</b><p class="mu">Pick one or more. Everything stays editable.</p><div class="w" id="ar">${AREAS.map(a=>`<button class="chip" data-a="${a}">${a}</button>`).join('')}</div>
<p><button class="p" id="go">Start</button></p></div>`;
$('#ar').onclick=e=>{const a=e.target.dataset.a;if(!a)return;e.target.classList.toggle('on');sel=sel.includes(a)?sel.filter(x=>x!==a):[...sel,a]};
$('#go').onclick=()=>{S.personas=sel.length?sel:['Custom'];S.tab='goals';render()}}
function vToday(){const d=S.sel||today(),hs=S.habits.filter(h=>sched(h,d));
const wk=[...Array(7)].map((_,i)=>addD(d,i-fromS(d).getDay())),nDone=hs.filter(h=>done(h,d)).length,isRest=S.rest.includes(d);
$('#app').innerHTML=`<h1>Today</h1><div class="strip">${wk.map(x=>`<button data-d="${x}" class="${x===d?'on':''}">${['Su','Mo','Tu','We','Th','Fr','Sa'][fromS(x).getDay()]}<b>${+x.slice(8)}</b></button>`).join('')}</div>
<div class="card hero"><div class="row sp"><b>${isRest?'Rest day':nDone+' of '+hs.length+' done'}</b><button class="g" id="rest">${isRest?'Undo rest day':'Mark rest day'}</button></div>
<div class="bar"><i style="width:${hs.length?nDone/hs.length*100:0}%"></i></div><div class="mu" style="color:#cfe;margin-top:8px">Level ${lvl()} · ${xp()} XP</div></div>
<div class="card row sp" style="background:#F6EDC0;color:#0F2A21"><div><b>Daily challenge</b><div style="color:#5b5330;font-size:14px">${CH[(+d.slice(8)+d.slice(5,7)*31)%CH.length]}</div></div><button class="${S.ch[d]?'p':'g'}" data-ch="1">${S.ch[d]?'Done ✓':'Mark done'}</button></div>
${hs.length?hs.map((h,i)=>`<div class="card row pc" style="background:${PAS[i%4]}"><button class="chk ${done(h,d)?'on':val(h,d)?'part':''}" data-h="${h.id}" aria-label="Log ${esc(h.name)}">${done(h,d)?'✓':h.target>1?val(h,d):''}</button>
<div style="flex:1"><b>${esc(h.name)}</b><div class="mu">${h.target>1?val(h,d)+' / '+h.target+' '+esc(h.unit):'Streak '+streak(h)+' days'}${h.target>1?' · streak '+streak(h):''}</div></div>
<button class="g" data-u="${h.id}" aria-label="Undo">↶ Undo</button></div>`).join(''):`<div class="card mu">${isRest?'Enjoy your rest. Your streaks are protected.':'No habits scheduled today. Create one under Goals.'}</div>`}`;
$('#rest').onclick=()=>{S.rest=S.rest.includes(d)?S.rest.filter(x=>x!==d):[...S.rest,d];render()};
$('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.d){S.sel=b.dataset.d;return render()}if(b.dataset.ch){S.ch[d]=!S.ch[d];return render()}
const h=S.habits.find(x=>x.id===(b.dataset.h||b.dataset.u));if(!h)return;
const L=S.logs[h.id]=S.logs[h.id]||{};
if(b.dataset.h){L[d]=Math.min(h.target,(L[d]||0)+1)}else{L[d]=Math.max(0,(L[d]||0)-1)}render()}}
function vGoals(){const G=S.goals;
$('#app').innerHTML=`<h1>Goals</h1>
<div class="card"><b>New goal</b><p><input id="gt" placeholder="Type what you want to achieve" style="width:100%"></p>
<div class="row"><select id="ga">${S.personas.map(a=>`<option>${a}</option>`).join('')}</select><input id="gd" type="date"><button class="p" id="ag">Add</button></div></div>
${G.length?G.map(g=>{const hs=S.habits.filter(h=>h.goal===g.id),ms=g.ms||[],md=ms.filter(m=>m.d).length;
return`<div class="card"><div class="row sp"><b>${esc(g.title)}</b><button class="g d" data-dg="${g.id}">🗑 Delete</button></div>
<div class="mu">${esc(g.area)}${g.due?' · due '+g.due:''}${ms.length?' · '+md+'/'+ms.length+' milestones':''}</div>
${ms.length?`<div class="bar"><i style="width:${md/ms.length*100}%"></i></div>`:''}
${ms.map((m,i)=>{const blocked=i>0&&!ms[i-1].d;return`<label class="row" style="padding:6px 0"><input type="checkbox" data-m="${g.id}:${i}" ${m.d?'checked':''} ${blocked?'disabled':''}><span class="${blocked?'mu':''}">${esc(m.t)}${blocked?' (locked until previous is done)':''}</span></label>`}).join('')}
<div class="row" style="margin-top:6px"><input data-mi="${g.id}" placeholder="Add milestone" style="flex:1"><button data-am="${g.id}">+</button></div>
${hs.map(h=>`<div class="row sp mu" style="margin-top:6px"><span>↳ ${esc(h.name)} · ${['Su','Mo','Tu','We','Th','Fr','Sa'].filter((_,i)=>h.days.includes(i)).join(' ')}</span><span><button class="g" data-pz="${h.id}">${h.paused?'Resume':'Pause'}</button><button class="g d" data-dh="${h.id}">Delete</button></span></div>`).join('')}
<details style="margin-top:8px"><summary>Add habit to this goal</summary>
<p><input data-hn="${g.id}" placeholder="Habit name" style="width:100%"></p>
<div class="w" data-hd="${g.id}">${['Su','Mo','Tu','We','Th','Fr','Sa'].map((x,i)=>`<label class="chip"><input type="checkbox" value="${i}" checked> ${x}</label>`).join('')}</div>
<div class="row"><input data-ht="${g.id}" type="number" min="1" value="1" style="width:80px" aria-label="Daily target"><input data-hu="${g.id}" placeholder="unit (e.g. pages)" style="flex:1"><button class="p" data-ah="${g.id}">Add</button></div></details></div>`}).join(''):'<div class="card mu">No goals yet. Type one above to begin; add milestones and habits to break it into daily actions.</div>'}`;
$('#ag').onclick=()=>{const t=$('#gt').value.trim();if(!t)return;S.goals.push({id:uid(),title:t,area:$('#ga').value,due:$('#gd').value,ms:[]});render()};
$('#app').onclick=e=>{const b=e.target.closest('button'),D=b&&b.dataset;if(!D)return;
if(D.dg){if(confirm('Delete this goal? Linked habits will be kept unlinked.')){S.habits.forEach(h=>{if(h.goal===D.dg)h.goal=null});S.goals=S.goals.filter(g=>g.id!==D.dg);render()}}
if(D.am){const i=document.querySelector(`[data-mi="${D.am}"]`),t=i.value.trim();if(t){S.goals.find(g=>g.id===D.am).ms.push({t,d:false});render()}}
if(D.pz){const h=S.habits.find(x=>x.id===D.pz);h.paused=!h.paused;render()}
if(D.dh&&confirm('Delete this habit and its history?')){S.habits=S.habits.filter(h=>h.id!==D.dh);delete S.logs[D.dh];render()}
if(D.ah){const q=s=>document.querySelector(`[data-${s}="${D.ah}"]`),n=q('hn').value.trim();if(!n)return;
const days=[...q('hd').querySelectorAll('input:checked')].map(x=>+x.value);if(!days.length)return alert('Pick at least one weekday.');
S.habits.push({id:uid(),name:n,goal:D.ah,days,target:Math.max(1,parseInt(q('ht').value)||1),unit:q('hu').value.trim()||'times',start:today(),paused:false});render()}};
$('#app').onchange=e=>{const m=e.target.dataset.m;if(!m)return;const[g,i]=m.split(':');S.goals.find(x=>x.id===g).ms[+i].d=e.target.checked;render()}}
let tmr=null,left=1500,run=false;
function vFocus(){const m=S.focus.filter(f=>f.date===today()).reduce((a,f)=>a+f.min,0);
$('#app').innerHTML=`<h1>Focus</h1><div class="card"><div class="big" id="t">${fmt(left)}</div>
<div class="row" style="justify-content:center"><select id="len"><option value="900">15 min</option><option value="1500" selected>25 min</option><option value="2700">45 min</option></select><button class="p" id="st">${run?'Pause':'Start'}</button><button id="rs">Reset</button></div></div>
<div class="card mu">Focused today: ${m} min. Missed a session? No penalty: just start another when ready.</div>
<div class="card"><b>Distraction note</b><p class="mu">Park a stray thought so you can return to it later.</p><input id="dn" placeholder="Note" style="width:100%"></div>`;
$('#len').value=String(left>=2700?2700:left>=1500?1500:900);
$('#len').onchange=e=>{if(!run){left=+e.target.value;$('#t').textContent=fmt(left)}};
$('#st').onclick=()=>{if(run){clearInterval(tmr);run=false}else{run=true;const len=+$('#len').value;tmr=setInterval(()=>{left--;const t=$('#t');if(t)t.textContent=fmt(left);
if(left<=0){clearInterval(tmr);run=false;S.focus.push({date:today(),min:Math.round(len/60)});left=len;save();alert('Session complete. Take a short break.');if(S.tab==='focus')render()}},1000)}render()};
$('#rs').onclick=()=>{clearInterval(tmr);run=false;left=+$('#len').value;render()}}
const fmt=s=>pad(Math.floor(s/60))+':'+pad(s%60);
function vJournal(){const d=today(),e=S.diary[d]||{mood:0,text:''};
$('#app').innerHTML=`<h1>Journal</h1><div class="card"><b>How was today?</b><div class="w" id="md" style="margin:8px 0">${['😞','😕','😐','🙂','😄'].map((x,i)=>`<button class="chip ${e.mood===i+1?'on':''}" data-m="${i+1}" aria-label="Mood ${i+1}">${x}</button>`).join('')}</div>
<textarea id="tx" placeholder="Reflection, lessons learned...">${esc(e.text)}</textarea><p><button class="p" id="sv">Save entry</button></p></div>
<h2>Past entries</h2>${Object.keys(S.diary).sort().reverse().filter(k=>k!==d).map(k=>`<div class="card"><b>${k}</b> ${['','😞','😕','😐','🙂','😄'][S.diary[k].mood]||''}<div class="mu">${esc(S.diary[k].text)}</div></div>`).join('')||'<div class="mu">None yet.</div>'}`;
$('#md').onclick=ev=>{const m=ev.target.dataset.m;if(m){S.diary[d]={...e,mood:+m,text:$('#tx').value};render()}};
$('#sv').onclick=()=>{S.diary[d]={mood:(S.diary[d]||{}).mood||0,text:$('#tx').value};render()}}
function vReport(){const end=today(),days=[...Array(7)].map((_,i)=>addD(end,-i));let sch=0,dn=0;
const rows=S.habits.map(h=>{let a=0,b=0;days.forEach(d=>{if(sched(h,d)){a++;if(done(h,d))b++}});sch+=a;dn+=b;return{h,a,b}});
const fm=S.focus.filter(f=>days.includes(f.date)).reduce((a,f)=>a+f.min,0),moods=days.map(d=>(S.diary[d]||{}).mood).filter(Boolean);
$('#app').innerHTML=`<h1>Weekly report</h1><div class="mu">Last 7 days, calculated only from your saved records.</div>
<div class="card"><b>${sch?dn+' of '+sch+' scheduled habit check-ins completed ('+Math.round(dn/sch*100)+'%)':'No scheduled habits in this period.'}</b>
<div class="mu">Focus: ${fm} min · Rest days: ${days.filter(d=>S.rest.includes(d)).length}${moods.length?' · Avg mood '+(moods.reduce((a,b)=>a+b)/moods.length).toFixed(1)+'/5 ('+moods.length+' entries)':''}</div></div>
${rows.map(r=>`<div class="card row sp"><span>${esc(r.h.name)}</span><span class="mu">${r.b}/${r.a} · streak ${streak(r.h)}</span></div>`).join('')}
<h2>Goal progress</h2>${S.goals.map(g=>{const ms=g.ms||[],n=ms.filter(m=>m.d).length,nx=ms.find(m=>!m.d);return`<div class="card"><b>${esc(g.title)}</b><div class="mu">${ms.length?n+'/'+ms.length+' milestones':'No milestones yet'}${nx?' · next: '+esc(nx.t):''}</div></div>`}).join('')||'<div class="mu">No goals yet.</div>'}`}
function vSet(){$('#app').innerHTML=`<div class="row">${LOGO}<h1 style="margin:0">Settings</h1></div>
<div class="card"><b>Theme</b><div class="w" style="margin-top:8px">${['system','light','dark','black'].map(t=>`<button class="chip ${S.theme===t?'on':''}" data-th="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div>
<div class="card"><b>Focus areas</b><div class="w" id="ar" style="margin-top:6px">${AREAS.map(a=>`<button class="chip ${S.personas.includes(a)?'on':''}" data-a="${a}">${a}</button>`).join('')}</div></div>
<div class="card"><b>Modules</b><p class="mu">Tap to switch trackers on or off.</p><div class="w">${allM().map(m=>`<button class="chip ${S.off.includes(m[0])?'':'on'}" data-md="${m[0]}">${m[1]} ${m[2]}</button>`).join('')}</div></div>
<div class="card"><b>Your data</b><p class="mu">Stored only in this browser on this device.</p><div class="w"><button class="g" id="ex">Export data (JSON)</button><button class="g d" id="del">Delete everything</button></div><textarea id="out" placeholder="Export appears here. Paste a backup here to import."></textarea><button class="g" id="im">Import backup</button></div>`;
$('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.th){S.theme=b.dataset.th;render()}
if(b.dataset.a){const a=b.dataset.a;S.personas=S.personas.includes(a)?S.personas.filter(x=>x!==a):[...S.personas,a];if(!S.personas.length)S.personas=['Custom'];render()}
if(b.dataset.md){const k=b.dataset.md;S.off=S.off.includes(k)?S.off.filter(x=>x!==k):[...S.off,k];render()}
if(b.id==='im'){try{const j=JSON.parse($('#out').value);if(!Array.isArray(j.habits))throw 0;S=Object.assign({},S,j);norm();render()}catch(x){alert('That is not a valid GoalKart backup.')}}
if(b.id==='ex'){const o=$('#out');o.hidden=false;o.value=JSON.stringify(S,null,2);o.select()}
if(b.id==='del'&&confirm('Permanently delete all goals, habits, logs and journal entries?')){try{localStorage.removeItem(KEY)}catch(x){}S=load();render()}}}

const CH=['Drink 8 glasses of water','Walk for 20 minutes','Read 10 pages','Keep your phone away for the first hour','Plan tomorrow tonight','Stretch for 5 minutes','Write 3 things you are grateful for','Finish one task you have been avoiding','Sleep before 11 pm','Do one focus session'];
const MODS=[['water','💧','Water','glasses',1,8,'#CFE8F5'],['sleep','😴','Sleep','hours',.5,8,'#E2D8F5'],['steps','👟','Steps','steps',1000,8000,'#CFE8D5'],['workout','🏋️','Workout','min',10,45,'#FCE3CF'],['read','📖','Reading','pages',5,20,'#F6EDC0'],['study','🎓','Study','min',15,120,'#E2D8F5'],['med','🧘','Meditation','min',5,10,'#CFE8D5'],['cal','🔥','Calories','kcal',100,2000,'#FCE3CF'],['prot','🥚','Protein','g',10,100,'#F6EDC0'],['save','🏦','Savings','₹',100,500,'#CFE8F5'],['spend','💸','Expenses','₹',100,1000,'#F9D5DD'],['jobs','💼','Job applications','apps',1,3,'#E2D8F5'],['trade','📈','Trade journal','entries',1,2,'#CFE8D5'],['skill','🛠️','Skill practice','min',15,60,'#FCE3CF'],['code','💻','Coding','min',15,60,'#CFE8F5'],['write','✍️','Writing','words',100,500,'#F6EDC0'],['grat','🙏','Gratitude','notes',1,3,'#F9D5DD'],['screen','📵','Screen time','min',15,120,'#E2D8F5']];
const allM=()=>MODS.concat(S.cust.map(c=>[c.id,c.e,c.n,c.u,c.st,c.g,'#E4EBDD']));
const tv=(id,d)=>(S.tr[id]||{})[d]||0;
const setv=(id,d,v)=>{(S.tr[id]=S.tr[id]||{})[d]=Math.max(0,Math.round(v*10)/10)};
function xp(){let x=0;S.habits.forEach(h=>Object.keys(S.logs[h.id]||{}).forEach(d=>{if(done(h,d))x+=10}));x+=S.tasks.filter(t=>t.d).length*5+S.focus.reduce((a,f)=>a+f.min,0)+Object.values(S.ch).filter(Boolean).length*20;allM().forEach(m=>Object.values(S.tr[m[0]]||{}).forEach(v=>{if(v>=m[5])x+=10}));return x}
const lvl=()=>Math.floor(Math.sqrt(xp()/50))+1;
const BG=[['🌱','First check-in',()=>S.habits.some(h=>Object.keys(S.logs[h.id]||{}).some(d=>done(h,d)))],['🔥','7-day streak',()=>S.habits.some(h=>streak(h)>=7)],['⏱️','100 focus minutes',()=>S.focus.reduce((a,f)=>a+f.min,0)>=100],['✅','10 tasks done',()=>S.tasks.filter(t=>t.d).length>=10],['🎯','First goal set',()=>S.goals.length>0],['🏁','Milestone reached',()=>S.goals.some(g=>(g.ms||[]).some(m=>m.d))],['📓','3 journal entries',()=>Object.keys(S.diary).length>=3],['📊','Tracker goal hit',()=>allM().some(m=>Object.values(S.tr[m[0]]||{}).some(v=>v>=m[5]))],['🏆','Level 5',()=>lvl()>=5]];
function vHub(){const d=S.sel||today();let h;
if(S.open==='new')h=`<button class="g" data-o="">← Back</button><div class="card"><b>New tracker</b><p><input id="cn" placeholder="Name (e.g. Piano)" style="width:100%"></p><div class="row"><input id="ce" placeholder="Emoji" style="width:80px"><input id="cu" placeholder="Unit" style="flex:1"></div><div class="row" style="margin-top:8px"><input id="cs" type="number" placeholder="Quick step" style="flex:1"><input id="cg" type="number" placeholder="Daily goal" style="flex:1"></div><p><button class="p" data-a="create">Create tracker</button></p></div>`;
else{const m=allM().find(x=>x[0]===S.open);h=m?trHtml(m,d):hubHtml(d)}
$('#app').innerHTML=h;$('#app').onclick=hubClick}
function hubHtml(d){return`<h1>Hub</h1><div class="mu">${d} · tap a tile to log. Switch tiles on or off in Settings.</div><div class="strip" style="margin-top:10px"></div><div class="grid">${allM().filter(m=>!S.off.includes(m[0])).map(m=>{const v=tv(m[0],d);return`<button class="tile" data-o="${m[0]}" style="background:${m[6]}"><span class="em">${m[1]}</span><b>${esc(m[2])}</b><span class="mu">${v} / ${m[5]} ${esc(m[3])}</span><div class="bar"><i style="width:${Math.min(100,v/m[5]*100)}%"></i></div></button>`}).join('')}<button class="tile add" data-o="new"><span class="em">＋</span><b>Custom tracker</b></button></div>`}
function trHtml(m,d){const[id,e,n,u,st,g]=m,v=tv(id,d),days=[...Array(7)].map((_,i)=>addD(d,i-6)),vs=days.map(x=>tv(id,x)),mx=Math.max(g,...vs),best=Math.max(0,...Object.values(S.tr[id]||{}));
return`<button class="g" data-o="">← Back</button><div class="card hero"><b>${e} ${esc(n)}</b><div class="big">${v}<span style="font-size:18px"> ${esc(u)}</span></div><div class="bar"><i style="width:${Math.min(100,v/g*100)}%"></i></div><div style="color:#cfe;font-size:14px;margin-top:6px">Goal ${g} ${esc(u)}${v>=g?' · reached ✓':''}</div></div>
<div class="w"><button class="p" data-a="${st}">+${st}</button><button class="p" data-a="${st*5}">+${st*5}</button><button class="g" data-a="${-st}">−${st}</button><button class="g d" data-a="reset">Reset day</button></div>
<div class="card"><b>Custom amount</b><div class="row" style="margin-top:8px"><input id="ca" type="number" step="any" style="flex:1"><button class="p" data-a="custom">Add</button></div></div>
<div class="card"><b>Last 7 days</b><div class="chart">${vs.map((x,i)=>`<div><i style="height:${x/mx*85}%"></i><span>${'SMTWTFS'[fromS(days[i]).getDay()]}</span></div>`).join('')}</div><div class="mu">Personal best: ${best} ${esc(u)}</div></div>
${S.cust.some(c=>c.id===id)?'<button class="g d" data-a="delc">Delete this tracker</button>':''}`}
function hubClick(e){const b=e.target.closest('button');if(!b)return;const D=b.dataset,d=S.sel||today();
if(D.d){S.sel=D.d;return render()}
if(D.o!==undefined){S.open=D.o;return render()}
if(D.a==='create'){const n=$('#cn').value.trim();if(!n)return;const id='c'+uid();S.cust.push({id,n,e:$('#ce').value.trim()||'⭐',u:$('#cu').value.trim()||'units',st:parseFloat($('#cs').value)||1,g:parseFloat($('#cg').value)||1});S.open=id;return render()}
const m=allM().find(x=>x[0]===S.open);if(D.a===undefined||!m)return;const id=m[0],cur=tv(id,d);
if(D.a==='reset')setv(id,d,0);
else if(D.a==='custom'){const n=parseFloat($('#ca').value);if(isNaN(n))return;setv(id,d,cur+n)}
else if(D.a==='delc'){if(!confirm('Delete this tracker and its records?'))return;S.cust=S.cust.filter(c=>c.id!==id);delete S.tr[id];S.open=''}
else setv(id,d,cur+parseFloat(D.a));render()}
function vTasks(){const f=S.tf||'all',T=S.tasks.filter(t=>f==='all'||(f==='done')===t.d),C=['#CFE8D5','#F6EDC0','#F9D5DD'];
$('#app').innerHTML=`<h1>Tasks</h1><div class="card"><input id="tt" placeholder="New task" value="${esc(S.td||'')}" style="width:100%"><div class="row" style="margin-top:10px"><div class="w">${['Low','Medium','High'].map((p,i)=>`<button class="chip ${(S.tp??1)===i?'on':''}" data-p="${i}">${p}</button>`).join('')}</div><button class="p" id="at" style="margin-left:auto">Add</button></div></div>
<div class="w">${['all','open','done'].map(x=>`<button class="chip ${f===x?'on':''}" data-f="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>
${T.map(t=>`<div class="card row pc" style="background:${C[t.p]}"><button class="chk ${t.d?'on':''}" data-k="${t.id}" aria-label="Toggle">${t.d?'✓':''}</button><div style="flex:1;${t.d?'text-decoration:line-through;opacity:.6':''}"><b>${esc(t.t)}</b></div><button class="g" data-x="${t.id}">Delete</button></div>`).join('')||'<div class="card mu">No tasks here yet.</div>'}`;
$('#at').onclick=()=>{const t=$('#tt').value.trim();if(!t)return;S.tasks.unshift({id:uid(),t,p:S.tp??1,d:false});S.td='';render()};
$('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset;
if(D.p!==undefined){S.td=$('#tt').value;S.tp=+D.p;render()}
if(D.f){S.tf=D.f;render()}
if(D.k){const t=S.tasks.find(x=>x.id===D.k);t.d=!t.d;render()}
if(D.x){S.tasks=S.tasks.filter(x=>x.id!==D.x);render()}}}
function vMore(){const L=[['focus','⏱️','Focus timer','#CFE8D5'],['journal','📓','Journal','#E2D8F5'],['report','📊','Weekly report','#CFE8F5'],['notes','🗒️','Notes','#F6EDC0'],['ach','🏆','Achievements','#FCE3CF'],['set','⚙️','Settings','#F9D5DD']];
$('#app').innerHTML=`<h1>More</h1><div class="grid">${L.map(l=>`<button class="tile" data-t="${l[0]}" style="background:${l[3]}"><span class="em">${l[1]}</span><b>${l[2]}</b></button>`).join('')}</div>`;
$('#app').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.t){S.tab=b.dataset.t;render()}}}
function vNotes(){$('#app').innerHTML=`<h1>Notes</h1><div class="card"><input id="nt" placeholder="Title" style="width:100%;margin-bottom:8px"><textarea id="nx" placeholder="Write something..."></textarea><p><button class="p" id="sn">Save note</button></p></div>${S.notes.map(n=>`<div class="card"><div class="row sp"><b>${esc(n.t||'Untitled')}</b><button class="g d" data-dn="${n.id}">Delete</button></div><div class="mu">${esc(n.x)}</div></div>`).join('')||'<div class="mu">No notes yet.</div>'}`;
$('#sn').onclick=()=>{const x=$('#nx').value.trim(),t=$('#nt').value.trim();if(!x&&!t)return;S.notes.unshift({id:uid(),t,x});render()};
$('#app').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.dn&&confirm('Delete this note?')){S.notes=S.notes.filter(n=>n.id!==b.dataset.dn);render()}}}
function vAch(){const x=xp(),l=lvl(),lo=50*(l-1)*(l-1),hi=50*l*l;
$('#app').innerHTML=`<h1>Achievements</h1><div class="card hero"><b>Level ${l}</b><div class="big">${x} XP</div><div class="bar"><i style="width:${(x-lo)/(hi-lo)*100}%"></i></div><div style="color:#cfe;font-size:14px;margin-top:6px">${hi-x} XP to level ${l+1}. XP is calculated from your records, so it can never be earned twice.</div></div>
<div class="grid">${BG.map(b=>{const ok=b[2]();return`<div class="tile" style="background:${ok?'#CFE8D5':'var(--card)'};${ok?'':'opacity:.55;color:var(--tx)'}"><span class="em">${b[0]}</span><b>${b[1]}</b><span class="mu">${ok?'Unlocked':'Locked'}</span></div>`}).join('')}</div>`}
render();
</script></body></html>
