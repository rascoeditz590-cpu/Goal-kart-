name: Build and Deploy GoalKart
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files and icons
        run: |
          mkdir -p www assets
          cp index.html www/
          cp -r Assets www/Assets
          cp Assets/icon-only.png assets/icon-only.png
          cp Assets/icon-foreground.png assets/icon-foreground.png
      - name: Create Android project
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets
          npx cap init GoalKart com.goalkart.app --web-dir=www
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#192E27' --iconBackgroundColorDark '#192E27'
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GoalKart-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
