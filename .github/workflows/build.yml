
name: Build and Deploy GoalKart

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check GoalKart HTML
        run: |
          if [ -f "index.html" ]; then
            echo "Found index.html"
          elif [ -f "GoalKart.html" ]; then
            cp "GoalKart.html" "index.html"
            echo "Created index.html from GoalKart.html"
          else
            echo "ERROR: GoalKart.html or index.html not found"
            exit 1
          fi

          test -s index.html
          grep -qi '<html' index.html
          grep -qi '</html>' index.html
          echo "Basic HTML checks passed"

      - name: Prepare website
        run: |
          mkdir -p dist
          cp index.html dist/index.html

          if [ -d "assets" ]; then
            cp -r assets dist/assets
          fi

          if [ -d "images" ]; then
            cp -r images dist/images
          fi

          touch dist/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy GoalKart
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
