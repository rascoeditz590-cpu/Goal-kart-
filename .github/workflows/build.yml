name: Build Goal Kart APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare website and logo
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp Assets/icon-only.png assets/icon.png
          test -s assets/icon.png

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install --save-dev @capacitor/assets

      - name: Create Android project
        run: |
          npx cap init "Goal Kart" "com.shridev.mera90din" --web-dir www
          npx cap add android

      - name: Generate app icons
        run: |
          npx capacitor-assets generate --android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build Goal Kart APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Goal-Kart.apk
          test -s Goal-Kart.apk

      - name: Upload Goal Kart APK
        uses: actions/upload-artifact@v4
        with:
          name: Goal-Kart-APK
          path: Goal-Kart.apk
          if-no-files-found: error
          retention-days: 14
